<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}EventHub{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav class="navbar">
  <a href="{{ url_for('index') }}" class="nav-logo">⬡ EventHub</a>
  <div class="nav-links">
    <a href="{{ url_for('index') }}">Browse Events</a>
    <a href="{{ url_for('create_event') }}" class="btn-nav">+ New Event</a>
  </div>
</nav>

<main class="main-content">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="flash-container">
        {% for category, message in messages %}
          <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  {% block content %}{% endblock %}
</main>

<footer class="footer">
  <p>© 2026 EventHub · Built with Flask &amp; ❤️</p>
</footer>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
